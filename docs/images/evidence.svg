<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 460" width="1180" height="460" font-family="ui-sans-serif,-apple-system,'Segoe UI',Inter,Roboto,sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#121926"/>
    </linearGradient>
    <filter id="g2" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1180" height="460" rx="18" fill="url(#bg2)"/>

  <text x="48" y="62" fill="#e6edf3" font-size="27" font-weight="700">A click that returns without an error</text>
  <text x="48" y="96" fill="#f85149" font-size="27" font-weight="700">is not evidence of anything.</text>

  <!-- ══ the four witnesses ══ -->
  <text x="48" y="152" fill="#6e7681" font-size="13.5" font-weight="600" letter-spacing="2.5">ASK FOUR WITNESSES</text>

  <rect x="48" y="170" width="300" height="62" rx="11" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="70" y="199" fill="#3fb950" font-size="17" font-weight="700">structure</text>
  <text x="70" y="220" fill="#8b949e" font-size="13.5">elements appeared or vanished</text>

  <rect x="48" y="242" width="300" height="62" rx="11" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="70" y="271" fill="#3fb950" font-size="17" font-weight="700">read-back</text>
  <text x="70" y="292" fill="#8b949e" font-size="13.5">the field holds what you asked for</text>

  <rect x="48" y="314" width="300" height="62" rx="11" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="70" y="343" fill="#d2a8ff" font-size="17" font-weight="700">window pixels</text>
  <text x="70" y="364" fill="#8b949e" font-size="13.5">against drift measured a moment ago</text>

  <rect x="48" y="386" width="300" height="48" rx="11" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="70" y="409" fill="#d2a8ff" font-size="17" font-weight="700">element pixels</text>
  <text x="70" y="427" fill="#8b949e" font-size="13">one typed glyph is enough</text>

  <!-- ══ verdicts ══ -->
  <text x="430" y="152" fill="#6e7681" font-size="13.5" font-weight="600" letter-spacing="2.5">ONE SAYS YES</text>

  <rect x="430" y="170" width="272" height="78" rx="12" fill="#0f2417" stroke="#3fb950" stroke-width="2"/>
  <text x="566" y="206" text-anchor="middle" fill="#3fb950" font-size="24" font-weight="700">executed</text>
  <text x="566" y="230" text-anchor="middle" fill="#8b949e" font-size="14">something really changed</text>

  <text x="430" y="288" fill="#6e7681" font-size="13.5" font-weight="600" letter-spacing="2.5">NONE DOES</text>

  <rect x="430" y="306" width="272" height="60" rx="12" fill="#2b1d10" stroke="#f0883e" stroke-width="2"/>
  <text x="566" y="336" text-anchor="middle" fill="#f0883e" font-size="21" font-weight="700">no_effect</text>
  <text x="566" y="356" text-anchor="middle" fill="#8b949e" font-size="13">the click missed</text>

  <rect x="430" y="376" width="272" height="58" rx="12" fill="#1c2128" stroke="#6e7681" stroke-width="2"/>
  <text x="566" y="405" text-anchor="middle" fill="#8b949e" font-size="21" font-weight="700">inconclusive</text>
  <text x="566" y="424" text-anchor="middle" fill="#6e7681" font-size="13">never counts as success</text>

  <!-- connectors -->
  <path d="M348,201 L430,205" stroke="#3fb950" stroke-width="2" opacity=".55"/>
  <path d="M348,273 L430,212" stroke="#3fb950" stroke-width="2" opacity=".55"/>
  <path d="M348,345 L430,222" stroke="#6e7681" stroke-width="2" opacity=".3"/>
  <path d="M348,410 L430,232" stroke="#6e7681" stroke-width="2" opacity=".3"/>

  <circle r="5" fill="#3fb950" filter="url(#g2)">
    <animateMotion dur="3.2s" repeatCount="indefinite" calcMode="linear" path="M348,201 L430,205"/>
    <animate attributeName="opacity" values="0;1;0" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- ══ why a fixed threshold fails ══ -->
  <rect x="760" y="140" width="380" height="294" rx="14" fill="#0f1620" stroke="#30363d" stroke-width="1.5"/>
  <text x="788" y="178" fill="#e6edf3" font-size="18" font-weight="700">Why pixels alone fail</text>
  <text x="788" y="204" fill="#8b949e" font-size="14">measured on a live desktop</text>

  <text x="788" y="246" fill="#8b949e" font-size="14">an idle screen, nothing happening</text>
  <rect x="788" y="256" width="324" height="12" rx="6" fill="#21262d"/>
  <rect x="788" y="256" width="110" height="12" rx="6" fill="#f0883e"/>
  <text x="1112" y="246" text-anchor="end" fill="#f0883e" font-size="17" font-weight="700">0.067</text>

  <text x="788" y="306" fill="#8b949e" font-size="14">a real page navigation</text>
  <rect x="788" y="316" width="324" height="12" rx="6" fill="#21262d"/>
  <rect x="788" y="316" width="324" height="12" rx="6" fill="#3fb950"/>
  <text x="1112" y="306" text-anchor="end" fill="#3fb950" font-size="17" font-weight="700">0.197</text>

  <text x="788" y="366" fill="#e6edf3" font-size="14.5">Three times apart — and both of them</text>
  <text x="788" y="388" fill="#e6edf3" font-size="14.5">would clear any fixed threshold you</text>
  <text x="788" y="410" fill="#e6edf3" font-size="14.5">picked in advance.</text>
</svg>
