[package]
name = "kratos-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The kratos broker: pipe owner, gate, kill switch, lease, journal, decider."

[dependencies]
kratos-protocol = { workspace = true }
kratos-ipc = { workspace = true }
kratos-gate = { workspace = true }
kratos-decide = { workspace = true }
kratos-shot = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }

[dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
]

[dev-dependencies]
tokio = { workspace = true, features = ["signal", "test-util"] }
