[package]
name = "kratos-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native perception and actuation in Rust: UI Automation, capture, OCR, pixels."

[dependencies]
kratos-protocol = { workspace = true }
kratos-ipc = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# UI Automation is COM, so this is the `windows` crate rather than
# `windows-sys`: the interfaces, not just the function signatures.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Variant",
    # VARIANT itself is gated on Ole as well as Com.
    "Win32_System_Ole",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    # Capture: a window's own pixels, not the whole desktop.
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    # OCR: Windows.Media.Ocr is WinRT, ships with Windows, needs no install
    # and no network. The language packs the user already has are the
    # languages it reads.
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
    # The OCR engine reports which language it read in.
    "Globalization",
]

# Waiting for a WinRT async from a worker thread.
[target.'cfg(windows)'.dependencies.windows-future]
version = "0.3"
